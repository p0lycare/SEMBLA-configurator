name: Pages

# Veröffentlicht den Konfigurator auf GitHub Pages. Die Tests sind Pflicht: ist einer rot,
# bleibt der bisherige Stand live.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html datenblatt.html css js data _site/
          if [ -d assets ]; then cp -r assets _site/; fi
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Dateien versionieren
        # Jede Veröffentlichung bekommt eigene Adressen für Module, Daten und Stile (?v=<Commit>).
        # So mischt der Browser-Cache nach einem Deploy keine alten und neuen Dateien.
        run: |
          V="${GITHUB_SHA::8}"
          sed -E -i "s#(from \"\./[A-Za-z0-9-]+\.js)\"#\1?v=$V\"#g; s#(import\(\"\./[A-Za-z0-9-]+\.js)\"#\1?v=$V\"#g; s#(\"\.\./data/[a-z]+\.json)\"#\1?v=$V\"#g" _site/js/*.js
          sed -E -i "s#(src=\"js/[a-z0-9-]+\.js)\"#\1?v=$V\"#g; s#(href=\"css/[a-z0-9-]+\.css)\"#\1?v=$V\"#g" _site/index.html _site/datenblatt.html
          grep -c "?v=$V" _site/index.html _site/js/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
